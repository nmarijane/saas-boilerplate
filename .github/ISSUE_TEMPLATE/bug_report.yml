name: 🐛 Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please be as detailed as possible.

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of saas-boilerplate are you using? (check `package.json`)
      placeholder: "e.g. 1.2.0"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the boilerplate is affected?
      options:
        - Authentication (Better Auth)
        - Billing (Stripe)
        - Multi-tenancy / Organizations
        - API Keys
        - Webhooks
        - Feature Flags
        - Admin Panel
        - Notifications
        - File Upload
        - Background Jobs (Inngest)
        - Email
        - i18n
        - CI/CD
        - Docker / Deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Clone the repo
        2. Run `npm run dev`
        3. Navigate to `/dashboard`
        4. Click on ...
        5. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please fill in your environment details.
      value: |
        - OS: [e.g. macOS 14, Ubuntu 22.04]
        - Node.js: [e.g. 22.0.0]
        - Package manager: [e.g. npm 10]
        - Database: [e.g. PGlite (local), PostgreSQL 16]
        - Deployment: [e.g. local, Docker, Vercel, Railway]
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs / Screenshots
      description: Paste any error messages, stack traces, or screenshots here.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have provided all the information above
          required: true
