name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude:
    # Run on @claude mentions, or auto-review on PR open/sync
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Auto-review prompt on PR open/sync
          direct_prompt: |
            ${{ github.event_name == 'pull_request' && 'Review this PR. Focus on:
            - Security vulnerabilities (auth, injection, data exposure)
            - Breaking changes or regressions
            - Code quality and adherence to project conventions (see CLAUDE.md)
            - Missing error handling
            - Performance concerns

            Be concise. Only flag real issues, not style preferences.
            Comment inline on specific lines when possible.' || '' }}

          # Allowed tools for the review
          allowed_tools: "Bash(npm run lint),Bash(npm run check:types),Bash(npx vitest run),Read,Glob,Grep"
